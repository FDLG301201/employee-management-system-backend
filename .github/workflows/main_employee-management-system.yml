name: Build and deploy ASP.Net Core app to Azure Web App - employee-management-system

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build employee-management-backend/employee-management-backend.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish employee-management-backend/employee-management-backend.csproj -c Release -o ./published

      - name: List published files
        run: |
          echo "Contents of published folder:"
          ls -la ./published

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./published

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    # QUITA ESTA SECCIÓN COMPLETA:
    # environment:
    #   name: 'Production'
    #   url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./published

      - name: List downloaded files
        run: |
          echo "Downloaded files:"
          ls -la ./published

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_02EAC58BDA044EBDA214B7FC63EB1FF2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4E0B68E6342B4EC3969A7F29692AA943 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9F77685EDE60447394C38BCCB06FB4E9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'employee-management-system'
          slot-name: 'Production'
          package: ./published
